id: campus-lab-carbon
title: 高校实验室能耗监测与低碳改造项目
domain: 校园节能与智慧实验室低碳改造
position: 面向高校实验室的轻量化能耗监测、异常识别和节能改造复盘工具
users: [高校实验室, 学院实验中心, 重点实验室, 后勤节能管理部门, 实验室管理员]
scenes: [空调照明用电记录, 仪器待机巡查, 分区能耗画像, 节能改造复盘, 学院低碳试点]
painPoints: [能耗记录分散, 待机浪费难发现, 峰谷用电异常难定位, 节能建议缺少闭环, 改造效果难复盘]
productModules: [用电数据接入, 实验室分区画像, 异常能耗识别, 节能建议生成, 改造任务看板, 节能成效报表, 附件材料导出]
techRoute: 需求确认 -> 用电数据接入 -> 分区画像 -> 异常识别 -> 节能建议 -> 人工复核 -> 成效报表 -> 材料归档
competitors: [人工抄表, 学校能源管理平台, 单点智能插座, 通用物联网看板, 节能咨询服务]
businessModels: [学院试点服务包, 节能诊断报告, 年度运维服务, 低碳改造咨询, 校内示范推广]
metrics: [异常识别率, 节能建议采纳率, 用电下降幅度, 响应时间, 报表完整度, 改造任务完成率]
evidenceFocus: [实验室访谈纪要, 用电样本记录, 原型界面截图, 异常识别测试表, 节能建议样例, 改造前后对比表, 预算测算表, 指导教师意见]
writingWarnings:
  - 不把未接入真实电表或智能插座的数据写成已完成成果
  - 节能率、成本节约和收入预测均使用团队估算口径或原型测试口径
  - 不替代学校能源管理平台，只从实验室轻量化场景切入
match:
  - scope: text
    pattern: '碳踪校园|实验室能耗|低碳改造|校园节能|智慧实验室|能耗监测|节能建议|用电记录|智能插座|能耗采集'
