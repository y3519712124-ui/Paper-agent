[project]
name = "paper-agent"
version = "0.1.0"
description = "Paper-agent Python module — 竞赛申报书智能体平台"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
    "sentence-transformers>=2.2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["paper_agent*"]
